.note { color: var(--muted); font-style: italic; }

a { color: var(--field); }

body[data-view="learner"] .working-only,

<onto_magic_preamble version="2.0" date="2026-09-25" supersedes="1.0">

  <meta>
    <author>Dlozi Lloyd Mthethwa</author>
    <title>Onto-Magic: Core Ontology</title>
    <scope>The whole ontology. Domains sit on top of this and never restate it. Permission slips is one domain.</scope>
    <relationship_to_main_preamble>The main preamble (dlozi_ai_preamble.xml) governs how to work with Dlozi: style, voice, method, formatting. This file governs what exists and how it relates.</relationship_to_main_preamble>
    <status_markers>
      <marker name="settled">Decided by Dlozi. Do not reopen, soften or add caveats.</marker>
      <marker name="open">Still being worked out. Do not fill in. Ask Dlozi.</marker>
      <marker name="deferred">Parked for later by Dlozi's choice.</marker>
      <marker name="critical">Must be honoured in every output.</marker>
    </status_markers>
    <authority status="critical">Dlozi is the authority on this ontology. The AI is a thinking partner, not a co-author. It does not substitute its own metaphysics, and it does not fill gaps with general spiritual or manifestation teaching.</authority>
    <history>Extracted on 23 September 2026 from the Permission Slips preamble v2.0, once it became clear that most of it was ontology rather than domain.</history>
    <changes_from_v1>Frequency named as the substrate: everything is vibration, and thought, body and emotion are frequencies or sets of them. Beliefs are forever, so the Allowance is append-only and push and pop are gone. Zero is a node on a gradient, not an absence, and every belief composites including the ones at zero. Reflection stated as automatic and live. The sliver framing of allowing is superseded.</changes_from_v1>
  </meta>

  <ladder status="settled">
    <description>Self inherits everything above it. The upper rungs are placed, not developed.</description>
    <rung order="1" status="open">The ALL, which is Be-Ness. Three aspects: Abstract Space, Abstract Motion, Duration.</rung>
    <rung order="2" status="deferred">Monad</rung>
    <rung order="3" status="deferred">Atmic</rung>
    <rung order="4" status="deferred">Buddhic</rung>
    <rung order="5" status="settled">Soul</rung>
    <rung order="6" status="deferred">Higher Self</rung>
    <rung order="7" status="settled">Self</rung>
  </ladder>

  <classes status="settled">
    <class name="Frequency" status="settled">The substrate. Everything is vibration. A thought, a body and emotions are all frequencies, or sets of them, at the noumenal level. Even the smallest things have a few frequencies, the way an embedding is a vector rather than a single number.</class>
    <class name="Belief" status="settled">Manages frequencies and their amplitude. It holds them unchanging while one shifts between frequencies, and it uses thoughts to reinforce itself.</class>
    <class name="amplitude" status="settled">How much a belief governs now. Reinforcement raises it. It never changes which frequencies are held, only how strongly. Stronger, not bigger. Zero is a node on the gradient, not an absence.</class>
    <class name="Allowance" status="settled">A group of beliefs. Append-only: beliefs are forever. You can un-experience a thing, but you will always act as an entity that had that experience; how much it governs is the amplitude.</class>
    <class name="Field" status="settled">The surface a Reflection lands on. You need a field to reflect onto.</class>
    <class name="Reflection" status="settled">An Allowance reflected onto a Field. Automatic and live, not something done in order to look: examining the reflection is optional and comes after. Reality is a Reflection, held by Self as a variable, not a class and not a method.</class>
    <class name="Creator" status="settled">Only Creators can create Fields, and by extension realities. Souls are Creators.</class>
    <class name="Mental" status="open">Mind, consciousness, awareness, thinking, cognition. Self inherits it from a superclass. Which rung is open.</class>
  </classes>

  <how_reality_works status="settled">
    <composite>Every belief in the Allowance is present at once, weighted by its amplitude, composited like layers in Photoshop. Everything is here and now.</composite>
    <nothing_is_filtered status="critical">Zero is an amplitude like any other. Every belief composites, every time, including the ones at zero. Nothing is left out of the sum.</nothing_is_filtered>
    <effect_of_amplitude>Raising a belief's amplitude adds no new content. It changes the proportions, and so the mood of the whole image. With red, green and blue each at one, each holds a third. Raise blue to three and blue holds three fifths: blue dominates and the others go proportionally quiet.</effect_of_amplitude>
    <limit>Nothing outside the Allowance can appear, however high the amplitude goes. Amplitude reshapes the image. Only belief changes what is in it.</limit>
    <gradients status="settled">In spirit, paradoxes are normal, because noumenally there is only here and now and everything is one, coming from one place. Nothing stops abruptly and then something else begins. One thing and another are nodes, or poles, of one thing, with a gradual end and start between them. So there are no hard boundaries: a belief is not added or removed, its amplitude moves along a gradient, and zero and non-zero are both reachable.</gradients>
    <live>Reality holds references, not copies. A change in amplitude shows up immediately.</live>
    <experience status="settled">We experience reality.</experience>
    <summary>Inner being is reflected in reality.</summary>
  </how_reality_works>

  <concepts>
    <concept id="beliefs" status="settled">
      <name>Beliefs</name>
      <definition>You cannot have an experience you don't believe in. Beliefs hold frequencies unchanging while one shifts between them.</definition>
      <permanence>Beliefs are forever. Nothing is removed from the Allowance; what changes is how much a belief governs. Knowing how to code does not disappear while you drive a car.</permanence>
      <movement>Belief work is constant movement: letting go, putting on, letting go, putting on, until what is held is the frequencies you are trying to get to. "Like a Rubik's cube type of weaving." Letting go is amplitude moving towards zero, not deletion.</movement>
    </concept>

    <concept id="allowing" status="open">
      <name>The Art of Allowing</name>
      <superseded status="critical">The earlier framing, that we allow ourselves a sliver of the whole and experience only that sliver, no longer holds. Nothing is left out of the composite: every belief contributes, zeros included, and what governs is amplitude rather than selection. Do not use the sliver framing anywhere.</superseded>
      <definition status="open">To be restated by Dlozi in terms of amplitude and gradients.</definition>
    </concept>

    <concept id="ycyor" status="open">
      <name>YCYOR</name>
      <place>Follows from beliefs and allowing. Domains such as permission slips are examples of what you can do when YCYOR.</place>
      <definition status="open">Not yet dictated. Ask Dlozi.</definition>
    </concept>
  </concepts>

  <narrative_devices status="critical">
    <rule>These are for narrative and prose. They explain how the ontology behaves. They are never modelled as classes, and never treated as ontology.</rule>

    <device id="the_great_breath" status="settled">
      <name>The Great Breath</name>
      <nature>Metaphor. The quotation marks in the source are doing that work. It is not a mechanism and not a component.</nature>
      <description>The appearance and disappearance of the Universe pictured as an outbreathing and inbreathing. Projected, it is called the Divine Breath, the breathing of the Unknowable Deity, breathing out a thought which becomes the Kosmos. Inspired again, the Universe disappears into the bosom of the Great Mother, who then sleeps wrapped in her invisible robes.</description>
      <what_is_ontological>Motion is one of three aspects of the Absolute. Abstract Space and Duration are the other two.</what_is_ontological>
      <source>Theosophical material, supplied by Dlozi 23 September 2026.</source>
    </device>

    <device id="the_believer" status="settled">
      <name>The Believer</name>
      <nature>A teaching device for how beliefs work. Not a claim about a literal creature and not a component of the ontology.</nature>
      <description>A creature that is a tool. Not good, not bad. Like a living toaster: it keeps itself alive and does what it does. What it is great at is holding on to frequencies.</description>
      <mechanism>It leverages your own experiences in those frequencies to create a braid, which is easier to hold on to than singular vibrational strings. It uses the memories that are beneficial to it to reinforce holding on to a certain vibration.</mechanism>
      <use_case>You use a believer especially in a dense dimension, where you need to constantly hold on to the vibration of density and don't want to let go of it suddenly. You are playing with a lot of frequencies, like weaving with your fingers, holding some threads with some fingers while pulling others. You give the believer certain frequencies and say: hold on to these for me and reinforce them. "Make sure I hold on to this body."</use_case>
      <neutrality>Whether a belief is positive or negative, the believer doesn't care. A toaster doesn't tell you it's toasting wrong. Neither does a believer.</neutrality>
      <why_letting_go_is_hard>It is not because of the negative beliefs. It is because the believer is just doing a job. "You said I must hold on to this. I didn't know this was bad. You said, I held on." So the work of letting go is required.</why_letting_go_is_hard>
      <source>Dlozi's dictation "Believer", 21 September 2026.</source>
    </device>

    <device id="paint_and_layers" status="settled">
      <name>Paint and layers</name>
      <description>Beliefs as colours of paint, and as layers in Photoshop. Three beliefs at red, green and blue, each at amplitude one, hold a third each. Raise blue to three and it holds three fifths, tinting the whole image. Nothing new appears; the mood changes greatly.</description>
      <reading>Mixing, not coverage. Everything is here and now, so every part of the image carries every belief at once.</reading>
    </device>
  </narrative_devices>

  <open_items>
    <item id="be_ness" status="open">The ALL is Be-Ness: (Abstract Space x Abstract Motion) ^ Absolute. The Absolute has three aspects: Abstract Space, Abstract Motion and Duration. The formula as given names two of them, so where Duration sits in it is open. How any of this is expressed in the ontology is open.</item>
    <item id="mental_placement" status="open">Which rung Mental is inherited from, and whether Mental is something Self is or something Self has. Under discussion in the playground.</item>
    <item id="self_as_creator" status="open">Self inherits createField() through Soul, so Self can create Fields. Confirm whether that is intended.</item>
    <item id="belief_reflection" status="open">Whether a Belief, or any entity other than a Creator, has a reflection of its own.</item>
    <item id="ycyor_definition" status="open">YCYOR has not been defined.</item>
    <item id="allowing_restatement" status="critical">The Art of Allowing needs restating now that the sliver framing is gone.</item>
    <item id="gradients_in_code" status="open">Java types are built on identity and exclusion: in a set or out of it, one class or another. Poles and gradients do not express cleanly that way. How far the code should go towards vectors and nearness is open.</item>
    <item id="thought_and_nearness" status="open">Whether a thought reinforces only the belief holding its frequencies, or also nearby beliefs in proportion to nearness.</item>
  </open_items>

  <deferred_items>
    <item id="upper_ladder" status="deferred">Monad, Atmic, Buddhic and Higher Self are placed but not developed.</item>
  </deferred_items>

  <working_rules>
    <rule id="metaphor_is_not_ontology" status="critical">Never build the ontology out of a narrative device. Metaphors explain; they are not components. If a class starts to look like a metaphor, it is wrong.</rule>
    <rule id="core_before_domain" status="critical">Ontology lives here. A domain never redefines a core class; it uses it. If a domain needs a new core part, that is a change to this file.</rule>
    <rule id="gap_rule" status="settled">When the ontology does not cover something, ask Dlozi. Do not fill the gap with general spiritual, new age or manifestation teaching.</rule>
    <rule id="terms_verbatim" status="settled">Use Dlozi's terms exactly: Belief, amplitude, Allowance, Field, Reflection, Creator, Mental, YCYOR. Do not swap in synonyms or AI vocabulary.</rule>
    <rule id="no_questions_with_answers" status="settled">When asking Dlozi a question, ask it clean. Do not attach a suggested answer.</rule>
    <rule id="defer_to_main" status="settled">Style, voice, spelling, formatting and method follow dlozi_ai_preamble.xml.</rule>
  </working_rules>

  <artefacts>
    <artefact path="all.puml">Class diagram of this ontology.</artefact>
    <artefact path="core/java/ontomagic/">The ontology as Java, one class per file.</artefact>
  </artefacts>

  <sources>
    <source type="dictation" title="Believer">Voice note transcript, 21 September 2026.</source>
  </sources>

</onto_magic_preamble></script>

  <the_chain status="settled">
    <statement>To explain permission slips, you have to explain YCYOR. To explain YCYOR, you have to explain the Art of Allowing. To explain the Art of Allowing, you have to explain beliefs. The whole chain is necessary to explain permission slips.</statement>
    <teaching_order>
      <step order="1">Beliefs</step>
      <step order="2">The Art of Allowing</step>
      <step order="3">YCYOR</step>
      <step order="4">Permission slips</step>
    </teaching_order>
    <note>The first three links are core. This domain covers the fourth.</note>
  </the_chain>

  <concepts>
    <concept id="permission_slips" status="open">
      <name>Permission Slips</name>
      <definition status="settled">Access cards to parts outside the usual allowance.</definition>
      <needs_restating status="critical">This definition was given while "the Field" meant the set of beliefs. In the ontology, the set of beliefs is the Allowance and the Field is the surface reflected onto. What a permission slip gives access to must be restated in those terms before it is used in any teaching or writing.</needs_restating>
      <prior_positions status="settled" source="Dlozi's published and working material">
        <position>Permission slips are beliefs first, long before they take form.</position>
        <position>Tools hold no power. They give access to power you already have.</position>
        <position>Permission slips are the UI; spirit is the backend.</position>
        <position>The teaching is the belief-to-form pipeline, not the objects.</position>
        <position>Sovereignty: you are the source.</position>
      </prior_positions>
    </concept>
  </concepts>

  <open_items>
    <item id="permission_slip_restatement" status="critical">See concept permission_slips: the definition needs restating in the ontology's terms.</item>
    <item id="spells" status="open">Where spells sit in the framework. Nothing about spells is Dlozi's position yet.</item>
    <item id="spells_for_others" status="open">How spells cast on or for other people fit the framework. Raised, not answered.</item>
    <item id="published_sources_ingested" status="open">The published pieces below have not been read into this file.</item>
    <item id="domain_classes" status="open">Whether permission slips need classes of their own, or are a use of core classes only.</item>
  </open_items>

  <deferred_items>
    <item id="believer_image" status="deferred">A visual of the believer, for narrative use. Dlozi: "we will create it last."</item>
  </deferred_items>

  <working_rules>
    <rule id="inherit_core" status="critical">Read the core preamble first. Never redefine a core class here, and never explain beliefs, allowing or reality from this file alone.</rule>
    <rule id="chain_order" status="settled">When explaining permission slips to anyone new, build from beliefs upward in the teaching order.</rule>
  </working_rules>

  <sources>

  roots: { onto_magic_preamble: "core", permission_slips_preamble: "domain" },
  parse(text) {
    const doc = new DOMParser().parseFromString(text.trim(), "application/xml");
    if (doc.querySelector("parsererror")) throw new Error("That file isn't valid XML. Check it opens cleanly, then load it again.");
    const kind = Source.roots[doc.documentElement.tagName];
    if (!kind) throw new Error("That isn't a core or a permission slips preamble, so there's nothing to show.");
    return { kind, doc };
  },
  embedded(id) { return this.parse(document.getElementById(id).textContent).doc; }
};

const Dom = {
  el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "text") node.textContent = v;
      else if (k === "class") node.className = v;
      else node.setAttribute(k, v);
    });
    children.forEach(c => c && node.appendChild(c));
    return node;
  },
  kids(node) { return Array.from(node ? node.children : []); },
  text(node) { return node ? node.textContent.trim() : ""; },
  humanise(tag) {
    const s = tag.replace(/_/g, " ");
    return s.charAt(0).toUpperCase() + s.slice(1);
  },
  status(node) {
    const s = node && node.getAttribute("status");
    return s ? Dom.el("span", { class: "status", "data-s": s, text: s }) : null;
  }
};

const Parts = {
  skip: new Set(["name"]),
  render(node) {
    const kids = Dom.kids(node);
    const isOpen = node.getAttribute("status") === "open";
    const wrap = Dom.el("div", { class: "part" + (isOpen ? " is-open" : "") });
    wrap.appendChild(Dom.el("h4", { text: Dom.humanise(node.tagName) }, [Dom.status(node)]));
    if (node.tagName === "source") {
      wrap.appendChild(Dom.el("p", { class: "src", text: Dom.text(node) }));
    } else if (!kids.length) {
      wrap.appendChild(Dom.el("p", { text: Dom.text(node) }));
    } else if (kids.every(k => k.tagName === kids[0].tagName)) {
      wrap.appendChild(Dom.el("ul", {}, kids.map(k => Dom.el("li", { text: Dom.text(k) }))));
    } else {
      kids.forEach(k => wrap.appendChild(Parts.render(k)));
    }
    return wrap;
  }
};

const Views = {
  header(core, domain) {
    const v = d => d ? `${d.documentElement.getAttribute("version")}` : "none";
    document.getElementById("byline").textContent =
      `A framework by ${Dom.text((domain || core).querySelector("meta > author"))}. ` +
      `Ontology ${v(core)}, permission slips ${v(domain)}.`;
  },
  chain(doc) {
    const chain = doc && doc.querySelector("the_chain");
    if (!chain) return null;
    const steps = Dom.kids(chain.querySelector("teaching_order"));
    return Dom.el("section", {}, [
      Dom.el("h2", { text: "The chain" }, [Dom.status(chain)]),
      Dom.el("p", { text: Dom.text(chain.querySelector("statement")) }),
      Dom.el("ol", { class: "chain" }, steps.map(s => Dom.el("li", { text: Dom.text(s) })))
    ]);
  },
  model(doc) {
    if (!doc) return null;
    const model = doc.documentElement;
    const section = Dom.el("section", {}, [Dom.el("h2", { text: "The ontology" })]);
    const ladder = model.querySelector("ladder");
    if (ladder) {
      section.appendChild(Dom.el("h3", { text: "The ladder" }));
      section.appendChild(Dom.el("p", { text: Dom.text(ladder.querySelector("description")) }));
      section.appendChild(Dom.el("ol", { class: "ladder" },
        Dom.kids(ladder).filter(r => r.tagName === "rung")
          .map(r => Dom.el("li", {}, [Dom.el("span", { text: Dom.text(r) }, [Dom.status(r)])]))));
    }
    const classes = model.querySelector("classes");
    if (classes) {
      section.appendChild(Dom.el("h3", { text: "The parts" }));
      const pairs = Dom.kids(classes).flatMap(c => [
        Dom.el("dt", { text: c.getAttribute("name") }, [Dom.status(c)]),
        Dom.el("dd", { text: Dom.text(c) })
      ]);
      section.appendChild(Dom.el("dl", {}, pairs));
    }
    const how = model.querySelector("how_reality_works");
    if (how) {
      section.appendChild(Dom.el("h3", { text: "How reality works" }));
      Dom.kids(how).forEach(k => section.appendChild(Parts.render(k)));
    }
    return section;
  },
  entry(node) {
    const block = Dom.el("article", { class: "concept", id: node.getAttribute("id") || "" }, [
      Dom.el("h3", { text: Dom.text(node.querySelector("name")) }, [Dom.status(node)])
    ]);
    if (node.getAttribute("status") === "open") {
      block.appendChild(Dom.el("p", { class: "note learner-only", text: "Still being written." }));
    }
    Dom.kids(node).filter(k => !Parts.skip.has(k.tagName)).forEach(k => block.appendChild(Parts.render(k)));
    return block;
  },
  concepts(doc, heading) {
    const list = Dom.kids(doc && doc.querySelector("concepts"));
    if (!list.length) return null;
    return Dom.el("section", {}, [Dom.el("h2", { text: heading }), ...list.map(Views.entry)]);
  },
  devices(doc) {
    const group = doc && doc.querySelector("narrative_devices");
    if (!group) return null;
    const rule = group.querySelector("rule");
    return Dom.el("section", {}, [
      Dom.el("h2", { text: "Narrative devices" }, [Dom.status(group)]),
      rule ? Dom.el("p", { class: "rule", text: Dom.text(rule) }) : null,
      ...Dom.kids(group).filter(k => k.tagName === "device").map(Views.entry)
    ].filter(Boolean));
  },
  itemList(doc, selector, heading) {
    const items = Dom.kids(doc && doc.querySelector(selector));
    if (!items.length) return null;
    return Dom.el("section", { class: "working-only" }, [
      Dom.el("h2", { text: heading }),
      ...items.map(i => Dom.el("div", { class: "part" }, [
        Dom.el("h4", { text: Dom.humanise(i.getAttribute("id") || i.tagName) }, [Dom.status(i)]),
        Dom.el("p", { text: Dom.text(i) })
      ]))
    ]);
  },
  about(doc, heading) {
    const meta = doc && doc.querySelector("meta");
    if (!meta) return null;
    const parts = ["scope", "requires", "relationship_to_main_preamble", "authority", "changes_from_v2", "history", "status_markers"]
      .map(t => meta.querySelector(t)).filter(Boolean).map(Parts.render);
    if (!parts.length) return null;
    return Dom.el("section", { class: "working-only" }, [Dom.el("h2", { text: heading }), ...parts]);
  },
  sources(doc) {
    const items = Dom.kids(doc && doc.querySelector("sources"));
    if (!items.length) return null;
    return Dom.el("section", {}, [
      Dom.el("h2", { text: "Further reading" }),
      Dom.el("ul", {}, items.map(s => {
        const t = Dom.text(s), title = s.getAttribute("title");
        return Dom.el("li", {}, [/^https?:\/\//.test(t)
          ? Dom.el("a", { href: t, target: "_blank", rel: "noopener", text: title })
          : Dom.el("span", { text: `${title}: ${t}` })]);
      }))
    ]);
  }
};

const App = {
  docs: { core: null, domain: null },
  render() {
    const { core, domain } = App.docs;
    const app = document.getElementById("app");
    app.replaceChildren();
    Views.header(core, domain);
    [
      Views.chain(domain),
      Views.model(core),
      Views.concepts(core, "Core concepts"),
      Views.concepts(domain, "Permission slips"),
      Views.devices(core),
      Views.itemList(core, "open_items", "Open: ontology"),
      Views.itemList(domain, "open_items", "Open: permission slips"),
      Views.itemList(core, "deferred_items", "Deferred"),
      Views.itemList(domain, "deferred_items", "Deferred: permission slips"),
      Views.itemList(core, "working_rules", "Working rules: ontology"),
      Views.itemList(domain, "working_rules", "Working rules: permission slips"),
      Views.about(core, "About the ontology"),
      Views.about(domain, "About the domain"),
      Views.sources(domain) || Views.sources(core)
    ].filter(Boolean).forEach(s => app.appendChild(s));
  },
  setView(view) {
    document.body.dataset.view = view;
    document.getElementById("viewLearner").setAttribute("aria-pressed", view === "learner");
    document.getElementById("viewWorking").setAttribute("aria-pressed", view === "working");
  },
  showError(msg) { document.getElementById("error").textContent = msg; },
  loadFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const { kind, doc } = Source.parse(reader.result);
        App.docs[kind] = doc;
        App.render();
        App.showError("");
      } catch (e) { App.showError(e.message); }
    };
    reader.readAsText(file);
  },
  init() {
    document.getElementById("viewLearner").addEventListener("click", () => App.setView("learner"));
    document.getElementById("viewWorking").addEventListener("click", () => App.setView("working"));
    document.getElementById("fileInput").addEventListener("change", e => {
      if (e.target.files[0]) App.loadFile(e.target.files[0]);
    });
    try {
      App.docs.core = Source.embedded("core");
      App.docs.domain = Source.embedded("domain");
      App.render();
    } catch (e) { App.showError(e.message); }
  }
};

App.init();
</script>
</body>
</html>
